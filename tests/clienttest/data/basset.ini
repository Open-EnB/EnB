; clienttest's own base assets (never the game's files, D69): co.cpp's model loader 0x6F51D0 reads this
; basset.ini's BASE-n sections from the run's folder (tools/harness/clienttest.py run copies it there).
; FILE is NAME.w3d: the fake asset manager (clienttest.cpp) "loads" a file and then has its NAME's model.
; A base asset with no section here gets Create_Render_Obj("missing"), as in the client.
; NAME ship...: a model with the bones ~FL ~FR ~BL ~BR; NAME rs_...: an rs_track model (Class_ID 0x10001).

