# What a hosted runner can check. The project's real verification, byte for byte against the
# retail client.exe with Visual C++ 6.0 SP4 (tools/vc6/importer.py verify, tools/vc6/pairs_cmp.py),
# needs the build VMs, the toolchain and the client, none of which is in the repository: it cannot
# run here and is run by the maintainer before each commit (docs/workflow.md). These checks guard
# everything around it: the documentation, the generated files, the tools, and what must not be
# published.
name: Checks

#
# When (API volume and emails, 2026-10-31): on pushes to master, and on pull requests when they open, get a new
# push, reopen or leave draft. Draft PRs are skipped (a run's draft PR gets a push at every heartbeat): their
# checks run when `ready_for_review` fires, on the head commit, so the required status `checks` is on the head
# of every PR that can merge; a push to a ready PR runs them again (synchronize). (A draft's skipped job reports
# `checks` as skipped, which GitHub counts as passing; a draft cannot merge, and leaving draft runs the real one on
# the same head, whose result is the one that counts.) A newer push cancels the run still going for the same ref.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:      # a maintainer can rerun the checks by hand (Actions tab, or gh workflow run)

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # tools/prepush_check.py scans the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Links resolve, stored files are LF (D147)
        run: python tools/docs_check.py
      - name: Generated documents are up to date (names.py, notexact.py)
        run: |
          python tools/re/names.py
          python tools/re/notexact.py
          git diff --exit-code -- docs/data/names-review.md docs/data/not-exact.md
      - name: The Python tools compile and their tests pass
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools -p "test_*.py"
      - name: Nothing that must stay out of the repository (binaries, captures, secrets, install paths)
        run: python tools/prepush_check.py
