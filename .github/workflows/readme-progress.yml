# Daily progress card. The shape follows Open-BFME's readme-progress workflow (a scheduled job that
# regenerates SVGs from the repository and commits them as github-actions[bot]); the generator,
# tools/progress.py, is this project's own and reads only data committed in docs/data/.
#
# Before the first push: replace OWNER/REPO below with the repository's full name. Until then the
# job is skipped everywhere (forks included). No GitHub Pages: the card is three SVGs in docs/.
# If the default branch is protected, allow github-actions[bot] to push to it or this job fails.
name: Daily progress card

on:
  schedule:
    - cron: '37 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-progress
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'OWNER/REPO'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # --history measures every day's last commit with `git show REF:path`
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure, extend the history and render the card
        run: python tools/progress.py --history --today --readme
      - name: Commit the card
        run: |
          git add docs/progress.svg docs/progress_chart.svg docs/progress_map.svg docs/data/progress-history.csv README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "docs: update the progress card"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
