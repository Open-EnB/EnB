<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="title desc">
  <title id="title">Earth &amp; Beyond client rebuild over time</title>
  <desc id="desc">Share of client.exe .text that is byte-exact and that is written in C++, per day.</desc>
  <style>
    .card { fill: #0d1117; stroke: #30363d; } .strong { fill: #f0f6fc; } .muted { fill: #8b949e; }
