    <circle cx="840.0" cy="105.6" r="3.2" class="l-exact" fill="none" stroke-width="2"><title>2026-10-29: 28.71%</title></circle>
    <text x="28" y="286" class="muted" font-size="11">One point per day, from that day's last commit; the D80 rule change (2026-10-25) makes earlier days under-count.</text>
